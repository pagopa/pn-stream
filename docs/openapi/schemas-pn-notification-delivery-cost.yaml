components:
  schemas:

    PaymentData:
      type: object
      required:
        - iuv
        - applyCost
      properties:
        iuv:
          type: string
          description: IUV del bollettino di pagamento
        applyCost:
          type: boolean
          description: Indica se applicare o meno i costi di notificazione
        recIndex:
          type: integer
        iun:
          type: string
          description: IUN della notifica associata al pagamento

    NotificationCostData:
      title: Notification cost Response for recipient
      description: >-
        Dati relativi al costo totale e alla modalità di aggiornamento per il destinatario.
      type: object
      required: [ totalCost, pagoPaIntMode, lastUpdate ]
      properties:
        pagoPaIntMode:
          $ref: '#/components/schemas/PagoPaIntMode'
        lastUpdate:
          type: string
          format: date-time
          description: Data dell'ultimo aggiornamento dei costi di notificazione
        totalCost:
          $ref: '#/components/schemas/TotalCost'

    TotalCost:
      title: Costo di notificazione applicato al destinatario
      description: >-
        Rappresentazione del costo totale (comprensivo di oneri e tributi) in eurocent.
      type: object
      required: [ costWithVat, details ]
      properties:
        costWithVat:
          description: Costo totale in eurocent (somma algebrica dei dettagli) comprensivo di IVA
          type: integer
          format: int32
        details:
          $ref: '#/components/schemas/TotalCostDetails'

    TotalCostDetails:
      title: Dettaglio del costo totale per il destinatario
      description: >-
        Scomposizione del costo di notifica in base alle diverse componenti di invio.
      type: object
      required: [ baseCostDetail, notificationFeePolicy ]
      properties:
        notificationFeePolicy:
          $ref: '#/components/schemas/NotificationFeePolicy'
        baseCostDetail:
          description: Dettaglio del costo base di notificazione
          $ref: '#/components/schemas/BaseCostDetail'
        analogCostDetail:
          description: Dettaglio del costo anlogico di notificazione
          $ref: '#/components/schemas/AnalogCostDetail'

    PagoPaIntMode:
      type: string
      description: >-
        Modalità di integrazione pagoPA per l'attualizzazione del costo della notifica. <br/>
        - _NONE_: nessuna attualizzazione. <br/>
        - _SYNC_: modalità sincrona. <br/>
        - _ASYNC_: modalità asincrona. <br/>
      enum:
        - NONE
        - SYNC
        - ASYNC

    Vat:
      description: IVA applicata ai costi cartacei (es. 22)
      type: integer
      format: int32
      minimum: 0
      maximum: 100

    NotificationFeePolicy:
      type: string
      description: >-
        Politica di calcolo dei costi.
      enum:
        - FLAT_RATE
        - DELIVERY_MODE

    ProductType:
      type: string
      description: >
        Tipologia di prodotto postale utilizzato:
          - __AR__: Raccomandata nazionale A/R
          - __890__: Atto giudiziario (Legge 890/1982)
          - __RIR__: Raccomandata internazionale A/R
          - __RS__: Raccomandata Semplice
          - __RIS__: Raccomandata internazionale Semplice

    BaseCostName:
      type: string
      description: >-
        Nome della componente di costo.
        PA_FEE: Diritti di notifica spettanti alla Pubblica Amministrazione (in eurocent).
        SEND_FEE: Costi operativi della piattaforma SEND (in eurocent).
      enum:
        - PA_FEE
        - SEND_FEE

    BaseCostDetail:
      type: object
      required: [ cost, baseCostComponents ]
      properties:
        cost:
          description: Costo totale in eurocent (somma algebrica delle componenti) escluso IVA
          type: integer
          format: int32
        baseCostComponents:
          description: Elenco delle componenti di costo base che concorrono a formare il costo totale
          type: array
          maxItems: 2
          items:
            $ref: '#/components/schemas/BaseCostComponent'

    BaseCostComponent:
      description: Componente di costo base per la notificazione
      type: object
      required: [ cost, costName ]
      properties:
        cost:
          description: Costo della componente in eurocent in cui non è inclusa l'IVA
          type: integer
          format: int32
        costName:
          $ref: '#/components/schemas/BaseCostName'

    AnalogCostDetail:
      type: object
      required: [ costWithVat, vat, analogCostComponents ]
      properties:
        costWithVat:
          description: Costo totale in eurocent (somma algebrica delle componenti) comprensivo di IVA
          type: integer
          format: int32
        vat:
          $ref: '#/components/schemas/Vat'
        analogCostComponents:
          description: Elenco delle componenti di costo analogiche che concorrono a formare il costo totale
          type: array
          maxItems: 2
          items:
            $ref: '#/components/schemas/AnalogCostComponent'

    AnalogCostName:
      type: string
      description: >-
        Nome della componente di costo.
        FIRST_ATTEMPT: Costo del primo tentativo di spedizione analogica (in eurocent).
        SECOND_ATTEMPT: Costo del secondo tentativo di spedizione analogica (in eurocent).
      enum:
        - FIRST_ATTEMPT
        - SECOND_ATTEMPT

    AnalogCostComponent:
      description: Componente di costo anlogica che concorre a formare il costo totale
      type: object
      required: [ cost, costName, productType ]
      properties:
        cost:
          description: Costo della componente in eurocent in cui non è inclusa l'IVA
          type: integer
          format: int32
        costName:
          $ref: '#/components/schemas/AnalogCostName'
        productType:
          $ref: '#/components/schemas/ProductType'